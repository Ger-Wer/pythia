name: Dual-Loop CI

on:
  push:
    branches: [main]
    paths:
      - services/**
      - tools/**
      - schemas/**
      - docs/dual_loop/**
      - .github/workflows/dual-loop-ci.yml
      - Makefile
      - docker-compose.dev.yml
      - infra/**
      - src/services/bus/**
      - src/services/watchlist_publisher.ts
      - scripts/contract/**
      - scripts/proto-gen-ts.sh
      - gateway-api/**
      - dashboard/**
      - sql/**
      - src/db/**
      - src/services/db.ts
      - src/services/db_pg.ts
      - src/services/db_shadow.ts
      - src/services/db_parity.ts
      - src/services/__tests__/**
      - scripts/pg_*.sh
      - scripts/pg_initial_load.ts
      - supercronic.crontab
      - drizzle.config.ts
      - package.json
      - bun.lock
      - python/**
      - Dockerfile
  pull_request:
    paths:
      - services/**
      - tools/**
      - schemas/**
      - docs/dual_loop/**
      - .github/workflows/dual-loop-ci.yml
      - Makefile
      - docker-compose.dev.yml
      - infra/**
      - src/services/bus/**
      - src/services/watchlist_publisher.ts
      - scripts/contract/**
      - scripts/proto-gen-ts.sh
      - gateway-api/**
      - dashboard/**
      - sql/**
      - src/db/**
      - src/services/db.ts
      - src/services/db_pg.ts
      - src/services/db_shadow.ts
      - src/services/db_parity.ts
      - src/services/__tests__/**
      - scripts/pg_*.sh
      - scripts/pg_initial_load.ts
      - supercronic.crontab
      - drizzle.config.ts
      - package.json
      - bun.lock
      - python/**
      - Dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo build --release
        run: cargo build --workspace --release

  tools-rust:
    name: Tools workspace (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  replay-determinism:
    name: Replay determinism (gate #9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services

      - name: Build replay binary (release)
        run: cargo build -p sniper-ingest --bin replay --release

      - name: Run replay once → /tmp/replay1.jsonl
        run: |
          ./target/release/replay \
            --dump sniper-ingest/tests/fixtures/replay/dump.jsonl \
            --watchlist sniper-ingest/tests/fixtures/replay/watchlist.jsonl \
            --clock-mode frozen \
            --deterministic-ids \
            > /tmp/replay1.jsonl

      - name: Run replay again → /tmp/replay2.jsonl
        run: |
          ./target/release/replay \
            --dump sniper-ingest/tests/fixtures/replay/dump.jsonl \
            --watchlist sniper-ingest/tests/fixtures/replay/watchlist.jsonl \
            --clock-mode frozen \
            --deterministic-ids \
            > /tmp/replay2.jsonl

      - name: Assert byte-identical between two runs
        run: |
          if ! diff -u /tmp/replay1.jsonl /tmp/replay2.jsonl; then
            echo "::error::replay output is non-deterministic across two runs (gate #9 broken)"
            exit 1
          fi

      - name: Assert match against committed expected.jsonl golden
        run: |
          if ! diff -u sniper-ingest/tests/fixtures/replay/expected.jsonl /tmp/replay1.jsonl; then
            echo "::error::replay output drifted from committed golden (gate #9). If intentional, regenerate fixtures (see services/sniper-ingest/tests/replay_determinism.rs)."
            exit 1
          fi

      - name: Run integration test (covers binary + golden via cargo)
        run: cargo test -p sniper-ingest --test replay_determinism

  load-harness-smoke:
    name: Load harness smoke (gate #4 #8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (services)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
          key: load-harness-services

      - name: Cache cargo (tools)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
          key: load-harness-tools

      # GitHub Actions `services:` does not let us pass extra args to
      # the container, so we cannot ask the official `nats:2.10-alpine`
      # service entry to enable JetStream (which the harness consumer
      # needs). Run a standalone `nats-server -js` sidecar instead.
      - name: Start NATS with JetStream (sidecar, port 4222)
        run: |
          docker run -d --rm --name nats-js -p 4222:4222 nats:2.10-alpine -js
          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              echo "NATS sidecar ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::NATS sidecar did not become ready"
          exit 1

      - name: Build sniper-ingest (release)
        working-directory: services
        run: cargo build -p sniper-ingest --bin sniper-ingest --release

      - name: Build load_harness (release)
        working-directory: tools
        run: cargo build -p load_harness --bin load_harness --release

      - name: Start sniper-ingest (mock mempool consumer + matcher)
        env:
          REDIS_URL: redis://127.0.0.1:6379
          NATS_URL: nats://127.0.0.1:4222
          MOCK_MEMPOOL_ENABLED: "true"
          METRICS_ADDR: 127.0.0.1:9101
          RUST_LOG: info
        run: |
          nohup ./services/target/release/sniper-ingest \
            > /tmp/sniper-ingest.log 2>&1 &
          echo $! > /tmp/sniper-ingest.pid
          # Give it a moment to register bus consumers + connect NATS.
          sleep 3
          if ! kill -0 "$(cat /tmp/sniper-ingest.pid)"; then
            echo "::error::sniper-ingest exited during startup"
            tail -100 /tmp/sniper-ingest.log
            exit 1
          fi

      - name: Run load_harness (1k/min, 30s, p95 < 50ms relaxed)
        working-directory: tools
        run: |
          ./target/release/load_harness \
            --redis-url redis://127.0.0.1:6379 \
            --nats-url nats://127.0.0.1:4222 \
            --rate-per-min 1000 \
            --duration-secs 30 \
            --warmup-secs 3 \
            --drain-secs 5 \
            --markets 4 \
            --target-p95-ms 50.0 \
            --max-drop-rate 0.0 \
            --min-rate-ratio 0.85 \
            --output json | tee /tmp/load_harness_report.json

      - name: Show sniper-ingest tail (debug)
        if: always()
        run: |
          echo "--- sniper-ingest tail ---"
          tail -60 /tmp/sniper-ingest.log || true

      - name: Stop sniper-ingest
        if: always()
        run: |
          kill "$(cat /tmp/sniper-ingest.pid)" 2>/dev/null || true
          docker stop nats-js 2>/dev/null || true

      - name: Upload load harness JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-harness-report
          path: /tmp/load_harness_report.json
          if-no-files-found: ignore

  proto:
    name: Protobuf (lint + breaking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        working-directory: schemas
        run: buf lint

      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        working-directory: schemas
        run: |
          buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=schemas" || true

  compose:
    name: docker-compose.dev.yml validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose -f docker-compose.dev.yml config --quiet

  bus-contract-tests:
    name: Bus contract tests (TS → Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Generate TS proto clients
        run: bun run proto:gen

      - name: Build Rust proto + common crate
        working-directory: services
        run: cargo build -p dual_loop_common --tests

      - name: Bun contract tests (roundtrip + topic parity)
        run: bun test src/services/bus/__tests__/contract.test.ts

      - name: Rust roundtrip tests
        working-directory: services
        run: cargo test -p dual_loop_common --test roundtrip

      - name: Cross-language test (TS publish → Rust consume)
        working-directory: services
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p dual_loop_common --test cross_lang -- --ignored --nocapture

  gateway-api:
    name: gateway-api (Bun — lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECT_PROTO_PUBLISH: "1"
    defaults:
      run:
        working-directory: gateway-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: root bun install
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Generate TS proto clients
        working-directory: .
        run: bun run proto:gen

      - name: bun install
        run: bun install --frozen-lockfile || bun install

      - name: bun run lint (tsc --noEmit)
        run: bun run lint

      - name: bun test
        run: bun test

      - name: bun run build
        run: bun run build

  dashboard:
    name: dashboard (Bun — typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: bun install
        run: bun install --frozen-lockfile || bun install

      - name: typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: vitest
        run: bun run test

      - name: vite build
        run: bun run build

  slow-loop-python:
    name: Slow-loop Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          # pytest is not in requirements.txt because the production image
          # only ships runtime deps. CI installs it separately.
          pip install pytest pytest-asyncio

      - name: pytest python/
        run: python -m pytest python/ -v

  docs:
    name: Docs (markdown link-check, light)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/dual_loop files present
        run: |
          set -eu
          for f in README.md 00-overview.md 01-containers.md 02-components.md \
                   03-data-flow.md 04-bus-protocol.md 05-command-center-ui.md \
                   06-roadmap.md 07-risks.md 08-tech-decisions.md; do
            test -f "docs/dual_loop/$f" || { echo "missing docs/dual_loop/$f"; exit 1; }
          done
          echo "All dual_loop docs present."

  shadow-pg-tests:
    name: Shadow PG (drizzle migrate + bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pythia_dev
          POSTGRES_USER: pythia
          POSTGRES_PASSWORD: pythia_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pythia -d pythia_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUAL_LOOP_PG_URL: postgres://pythia:pythia_dev_password@127.0.0.1:5432/pythia_dev
      DUAL_LOOP_PG_TEST_URL: postgres://pythia:pythia_dev_password@127.0.0.1:5432/pythia_dev
      DEEPSEEK_API_KEY: ci-stub-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Verify drizzle-kit generate is in sync with schema
        run: |
          bun x drizzle-kit generate --name ci_verify
          # drizzle-kit writes either a no-op marker or an additional SQL file;
          # fail only when the *schema* snapshot or SQL content drifts.
          if ! git diff --quiet sql/migrations/; then
            echo "::error::Schema drift detected. Run 'bun run db:pg:generate' and commit the result."
            git --no-pager diff sql/migrations/ | head -200
            exit 1
          fi

      - name: Apply migrations to Postgres
        run: bash scripts/pg_migrate.sh

      - name: Bun test (db_pg / db_shadow / db_parity)
        run: bun test src/services/__tests__/db_pg.test.ts src/services/__tests__/db_shadow.test.ts src/services/__tests__/db_parity.test.ts

      - name: db:parity smoke run on empty shadow
        run: bun run db:parity
