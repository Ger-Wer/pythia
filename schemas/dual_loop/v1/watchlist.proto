syntax = "proto3";

package dual_loop.v1;

import "dual_loop/v1/common.proto";

// pythia-core → sniper-ingest: добавить/обновить рынок в watchlist.
// Sniper подписан на CTF-контракт и оракул-события по этому рынку.
message WatchlistUpsert {
  Uuid message_id = 1;
  MarketId market = 2;
  uint64 version = 3;                      // монотонный per-market

  double edge = 4;                         // P_fundamental - P_market, подписан
  double p_fundamental = 5;                // 0..1
  double confidence = 6;                   // 0..1
  Side side_hint = 7;

  Money max_position_usd = 8;
  uint32 max_slippage_bps = 9;             // 50 = 0.5%
  int64 ttl_ms = 10;                       // watchlist entry expiry

  Timestamp issued_at = 11;

  // Параметры триггера: какие on-chain события считать триггером.
  TriggerPolicy trigger_policy = 12;
}

// pythia-core → sniper-ingest: снять рынок с watchlist.
message WatchlistRemove {
  Uuid message_id = 1;
  MarketId market = 2;
  uint64 version = 3;
  Reason reason = 4;
  Timestamp issued_at = 5;
}

message TriggerPolicy {
  // Требуемое минимальное количество независимых источников подтверждения.
  uint32 min_independent_sources = 1;

  // Разрешённые типы триггеров.
  repeated TriggerKind allowed_kinds = 2;

  // Максимальное ожидаемое проскальзывание при входе в bps.
  uint32 max_price_impact_bps = 3;
}

enum TriggerKind {
  TRIGGER_KIND_UNSPECIFIED = 0;
  TRIGGER_KIND_ORACLE_RESOLUTION = 1;      // UMA/Chainlink resolution tx
  TRIGGER_KIND_LARGE_FILL = 2;             // крупная сделка в CTF контракте
  TRIGGER_KIND_ADMIN_ACTION = 3;           // админ-функции контракта
  TRIGGER_KIND_NEWS_CONFIRMED = 4;         // news → on-chain confirmation
}
