syntax = "proto3";

package dual_loop.v1;

import "dual_loop/v1/common.proto";

// sniper-executor → all: транзакция подписана и отправлена.
message ExecSubmitted {
  Uuid message_id = 1;
  Uuid trigger_id = 2;
  MarketId market = 3;

  bytes tx_hash = 4;                       // 32 bytes
  uint64 nonce = 5;
  Money size = 6;
  Side side = 7;

  uint64 max_fee_per_gas_wei = 8;
  uint64 max_priority_fee_per_gas_wei = 9;
  string relay_used = 10;                  // "bloxroute" | "merkle" | "public"

  int64 submitted_at_unix_ms = 11;
  bool paper_mode = 12;                    // true до Phase 3
}

// sniper-executor → all: транзакция замайнена, получен fill.
message ExecFilled {
  Uuid message_id = 1;
  bytes tx_hash = 2;
  MarketId market = 3;

  Money realized_price = 4;                // средняя цена исполнения (USDC micros)
  Money filled_size = 5;
  Money gas_spent_usd = 6;
  uint64 block_number = 7;

  int64 filled_at_unix_ms = 8;
  bool paper_mode = 9;
}

// sniper-executor → all: транзакция revert'нулась / не исполнилась.
message ExecReverted {
  Uuid message_id = 1;
  bytes tx_hash = 2;
  MarketId market = 3;

  string reason = 4;                       // "out_of_gas" | "revert: …" | "timeout"
  Money gas_spent_usd = 5;
  uint64 block_number = 6;                 // 0 если не mined

  int64 reverted_at_unix_ms = 7;
  bool paper_mode = 8;
}

// sniper-executor → gateway-api: периодический статус для Command Center WSS.
// Публикуется примерно раз в секунду; gateway-api проксирует через WebSocket.
message ExecStatus {
  // Heartbeat counter (monotonically increasing).
  uint64 heartbeat_seq = 1;

  // Emitted-at Unix epoch ms (host wall-clock).
  int64 emitted_at_unix_ms = 2;

  ExecutorState state = 3;

  // Текущий market, если state ∈ {IN_TRADE, WAITING_FILL}.
  MarketId current_market = 4;

  // Сколько триггеров обработано с момента старта.
  uint64 triggers_seen_total = 5;
  uint64 triggers_executed_total = 6;

  // Kill-switch engaged. Если true, все поля выше — historic, новых сделок нет.
  bool kill_engaged = 7;

  // Paper-mode — до Phase 3 всегда true.
  bool paper_mode = 8;
}

enum ExecutorState {
  EXECUTOR_STATE_UNSPECIFIED = 0;
  EXECUTOR_STATE_IDLE = 1;                 // idle, готов принимать триггеры
  EXECUTOR_STATE_WAITING_FILL = 2;         // tx submitted, ждём mined/reverted
  EXECUTOR_STATE_IN_TRADE = 3;             // позиция открыта
  EXECUTOR_STATE_DRAINING = 4;             // kill engaged, доводим open tx'ы
  EXECUTOR_STATE_HALTED = 5;               // kill engaged, активных tx нет
}
