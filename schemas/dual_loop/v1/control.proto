syntax = "proto3";

package dual_loop.v1;

import "dual_loop/v1/common.proto";

// gateway-api → sniper-executor: команда на остановку.
// Подписана HMAC-SHA256 секретом, хранимым в HSM.
message KillCommand {
  Uuid message_id = 1;
  string operator_id = 2;
  KillScope scope = 3;
  MarketId market = 4;                     // only if scope == MARKET
  uint64 nonce = 5;                        // anti-replay
  int64 issued_at_unix_ms = 6;             // executor проверяет ∈ [now-5s, now+5s]

  // HMAC(secret, message_id || operator_id || scope || market || nonce || issued_at).
  bytes signature = 7;
}

enum KillScope {
  KILL_SCOPE_UNSPECIFIED = 0;
  KILL_SCOPE_GLOBAL = 1;                   // stop everything, drain all positions
  KILL_SCOPE_MARKET = 2;                   // stop only specific market
  KILL_SCOPE_NEW_TRIGGERS = 3;             // don't arm new triggers, let running ones finish
}

// sniper-executor → gateway-api: подтверждение получения и обработки.
message KillAck {
  Uuid message_id = 1;
  Uuid original_command_id = 2;
  KillScope scope = 3;
  KillAckStatus status = 4;
  string detail = 5;

  uint32 active_triggers_cancelled = 6;
  uint32 pending_tx_cancelled = 7;

  int64 ack_at_unix_ms = 8;
}

enum KillAckStatus {
  KILL_ACK_STATUS_UNSPECIFIED = 0;
  KILL_ACK_STATUS_ACCEPTED = 1;
  KILL_ACK_STATUS_DRAINING = 2;            // в процессе
  KILL_ACK_STATUS_COMPLETE = 3;
  KILL_ACK_STATUS_REJECTED_BAD_SIGNATURE = 4;
  KILL_ACK_STATUS_REJECTED_STALE = 5;      // issued_at outside window
  KILL_ACK_STATUS_REJECTED_REPLAY = 6;     // same nonce seen before
}
