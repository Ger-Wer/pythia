syntax = "proto3";

package dual_loop.v1;

import "dual_loop/v1/common.proto";

// sniper-orderbook → sniper-risk (and downstream):
// snapshot of an order-book's top-of-book state, published periodically
// (e.g. on every applied delta, or rate-limited per-market) so the risk
// guard can run slippage / liquidity checks on TradeIntent.evaluate().
//
// This is a **derived** view, not the raw L2 book. It is small enough to
// fit on the hot path and to be JetStream-replayable without blowing up
// disk. Consumers that need full depth subscribe to a different feed.
//
// Wire convention (see common.proto):
//   * `best_bid_micros` / `best_ask_micros` follow `Money.amount_micros`
//     semantics (1_000_000 = $1.00; Polymarket binary outcomes 0..$1
//     therefore live in 0..1_000_000).
//   * `spread_bps` and `mid_micros` are computed at publish time so that
//     consumers don't all reimplement the same arithmetic. They are
//     redundant with the bid/ask pair and must remain consistent.
//   * `liquidity_available_micros` is the **sum of size_micros** across
//     the top-N levels chosen by the publisher (see `liquidity_depth`).
//     Sized in the same micros as `Money.amount_micros` for outcome
//     shares. `liquidity_depth` documents the N that was used.
//   * `last_sequence` is host-monotonic, mirroring `OrderBook::last_sequence()`.
//     Polymarket WS has no strict +1 seq; the host assigns this on receive.
//   * `crossed` reflects `best_bid >= best_ask` at publish time. Crossed
//     books are transient HFT noise on hybrid CLOBs; consumers should
//     not panic on them but may choose to skip slippage checks.
message OrderBookUpdate {
  // Idempotency / dedup id (UUIDv7).
  Uuid message_id = 1;

  // Canonical market identity. For Polymarket binary markets, the
  // `market_specific_key` is the conditionId; the side of the binary
  // outcome (YES vs NO) is folded into `asset_id` below since both
  // sides share a conditionId but trade as separate tokens.
  MarketId market = 2;

  // The exact tokenId / asset_id this book belongs to. Required because
  // Polymarket bundles YES + NO sides of a binary market into one WS
  // event; we publish one OrderBookUpdate per side.
  string asset_id = 3;

  // Best bid / best ask in micros, or 0 if that side has no liquidity.
  // Mid and spread are derived but published explicitly so subscribers
  // don't all re-implement the same float-free arithmetic.
  int64 best_bid_micros = 4;
  int64 best_ask_micros = 5;
  int64 mid_micros = 6;

  // Spread expressed in basis points off mid: spread_bps =
  // (best_ask - best_bid) * 10_000 / mid. Signed because crossed books
  // produce a negative spread.
  sint64 spread_bps = 7;

  // Sum of size_micros across the top `liquidity_depth` levels on the
  // bid side, and respectively the ask side. Each side reports its own
  // sum because they're not symmetric. 0 if the side is empty.
  int64 liquidity_bid_micros = 8;
  int64 liquidity_ask_micros = 9;

  // The N used to compute the liquidity_*_micros sums. Typically 3 for
  // top-of-book health checks, but the publisher decides.
  uint32 liquidity_depth = 10;

  // Whether bid >= ask at publish time. Consumers may use this to skip
  // certain checks but MUST NOT degrade their own state on this flag —
  // it is expected to clear within the next few deltas.
  bool crossed = 11;

  // Wall-clock time the publisher applied the delta that produced this
  // top-of-book snapshot. Unix epoch ms.
  int64 timestamp_ms = 12;

  // Host-monotonic sequence assigned by the publisher on WS-message
  // receive. Mirrors `OrderBook::last_sequence()`. Used by consumers
  // for ordering and dedup within a single publisher session.
  uint64 last_sequence = 13;
}
