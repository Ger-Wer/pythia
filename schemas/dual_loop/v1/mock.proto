syntax = "proto3";

package dual_loop.v1;

import "dual_loop/v1/common.proto";
import "dual_loop/v1/watchlist.proto";

// Dev-only injector → sniper-ingest:
// synthetic mempool transaction used to exercise Paper Mode end-to-end
// without a live ANVIL_WS_URL.
message MockMempoolTx {
  Uuid message_id = 1;
  MarketId market = 2;
  TriggerKind kind = 3;
  bytes tx_hash = 4;
  uint64 observed_at_ns = 5;
}
