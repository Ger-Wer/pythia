global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    environment: dev
    stack: dual-loop

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sniper-ingest
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          service: sniper-ingest

  - job_name: sniper-executor
    static_configs:
      - targets: ["host.docker.internal:9102"]
        labels:
          service: sniper-executor

  - job_name: gateway-api
    static_configs:
      - targets: ["host.docker.internal:9103"]
        labels:
          service: gateway-api
