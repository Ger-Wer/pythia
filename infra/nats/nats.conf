# NATS server config for Dual-Loop dev environment.
# JetStream включён для at-least-once доставки telemetry.

server_name: dual-loop-dev
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 1GB
}

max_payload: 1MB

# Для dev не включаем auth. В staging/prod — nkeys или TLS.
