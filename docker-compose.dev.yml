# Dual-Loop dev infrastructure.
#
# Этот файл НЕ заменяет существующий docker-compose.yml (production Pythia).
# Он поднимает параллельный стек для разработки Dual-Loop архитектуры:
# bus (Redis + NATS), Postgres, observability (Prometheus/Grafana/Loki/Tempo).
#
# Использование:
#   docker compose -f docker-compose.dev.yml up -d   # поднять
#   docker compose -f docker-compose.dev.yml down    # остановить
#   make dev-up / make dev-down                      # удобные обёртки
#
# Все сервисы биндятся на 127.0.0.1 чтобы не торчать наружу на dev-машине.

name: pythia-dual-loop-dev

services:
  # -------- Integration Bus --------

  redis:
    image: redis:7.4-alpine
    container_name: dual-loop-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    networks:
      - dual-loop
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: dual-loop-nats
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    networks:
      - dual-loop
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------- Persistent Store --------

  postgres:
    image: postgres:16-alpine
    container_name: dual-loop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pythia_dev
      POSTGRES_USER: pythia
      POSTGRES_PASSWORD: pythia_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - dual-loop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythia -d pythia_dev"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------- Observability --------

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: dual-loop-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - dual-loop

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: dual-loop-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dual-loop
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    container_name: dual-loop-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - dual-loop

  tempo:
    image: grafana/tempo:2.6.1
    container_name: dual-loop-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"   # tempo http
      - "127.0.0.1:4317:4317"   # otlp grpc
      - "127.0.0.1:4318:4318"   # otlp http
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - dual-loop

  # -------- Fast Loop (Rust) --------
  #
  # Oба сервиса собираются из services/Dockerfile с разными BIN build-arg.
  # Для изоляции от хоста metrics-порты пробрасываются только на 127.0.0.1.
  # В Phase 1 оба контейнера пока только поднимают observability + bus-connect;
  # реальная execution-логика появится в Phase 2.

  sniper-ingest:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        BIN: sniper-ingest
    container_name: dual-loop-sniper-ingest
    restart: unless-stopped
    environment:
      METRICS_ADDR: "0.0.0.0:9101"
      MOCK_MEMPOOL_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      NATS_URL: "nats://nats:4222"
      ANVIL_WS_URL: "ws://anvil:8545"
      RUST_LOG: "info"
    ports:
      - "127.0.0.1:9101:9101"
    networks:
      - dual-loop
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      anvil:
        condition: service_started

  sniper-executor:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        BIN: sniper-executor
    container_name: dual-loop-sniper-executor
    restart: unless-stopped
    environment:
      METRICS_ADDR: "0.0.0.0:9102"
      REDIS_URL: "redis://redis:6379"
      NATS_URL: "nats://nats:4222"
      PAPER_MODE: "true"
      RUST_LOG: "info"
      # Must match gateway-api's KILL_HMAC_SECRET; both sides verify the kill
      # envelope HMAC. Defaults to the dev value so a fresh `make dev-up` works
      # without a .env, but staging/prod must override via .env (Track A3).
      KILL_HMAC_SECRET: "${KILL_HMAC_SECRET:-dev-kill-hmac-secret-change-me}"
    ports:
      - "127.0.0.1:9102:9102"
    networks:
      - dual-loop
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # -------- Gateway API (Phase 1 Track B) --------
  #
  # Bridges Redis Streams / NATS to Command Center UI over WSS + REST.

  gateway-api:
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    container_name: dual-loop-gateway-api
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "9103"
      LOG_LEVEL: "info"
      REDIS_URL: "redis://redis:6379"
      NATS_URL: "nats://nats:4222"
      # DEV-ONLY defaults. Override in staging/prod via .env / a real secrets
      # store. Generation recipes:
      #   GATEWAY_PASETO_KEY:    openssl rand -base64 32
      #   KILL_HMAC_SECRET:      openssl rand -hex 32
      #   OPERATOR_PASSWORD_HASH: bun run -e "console.log(require('bcryptjs').hashSync(process.argv[1],10))" -- <password>
      # Track A3: rotation is required before live trading.
      GATEWAY_PASETO_KEY: "${GATEWAY_PASETO_KEY:-cHl0aGlhLWR1YWwtbG9vcC1kZXYta2V5LTMyYnl0ZXM=}"
      OPERATOR_ID: "${OPERATOR_ID:-admin}"
      OPERATOR_PASSWORD_HASH: "${OPERATOR_PASSWORD_HASH:-$$2a$$10$$o8TxQnbbSnYLUQ8b97fj9e.FrX3uuKA9CS5Ftx4QbO9CxVGRbcFTq}"
      KILL_HMAC_SECRET: "${KILL_HMAC_SECRET:-dev-kill-hmac-secret-change-me}"
    ports:
      - "127.0.0.1:9103:9103"
    networks:
      - dual-loop
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9103/api/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------- Blockchain Dev Node --------

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: dual-loop-anvil
    restart: unless-stopped
    # Fork is optional. When POLYGON_RPC_URL is set in .env we fork live
    # Polygon state (needed once we test against real Polymarket markets);
    # when it is empty/unset we boot a fresh chain-id 137 dev node, which
    # is sufficient for paper-mode E2E and for hermetic CI runs (the public
    # https://polygon-rpc.com endpoint started returning 401 "tenant disabled"
    # for unauthenticated traffic, so it is no longer a usable default).
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "${POLYGON_RPC_URL:-}" ]; then
          exec anvil --host 0.0.0.0 --chain-id 137 --block-time 2 --fork-url "$$POLYGON_RPC_URL"
        else
          exec anvil --host 0.0.0.0 --chain-id 137 --block-time 2
        fi
    command: []
    ports:
      - "127.0.0.1:8545:8545"
    networks:
      - dual-loop
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  dual-loop:
    name: dual-loop
    driver: bridge

volumes:
  redis-data:
  nats-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
