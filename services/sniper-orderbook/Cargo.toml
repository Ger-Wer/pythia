[package]
name = "sniper-orderbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast Loop: Polymarket L2 order-book tracker (REST snapshot + WS incremental, deterministic state machine)."

[lib]
name = "sniper_orderbook"
path = "src/lib.rs"

[features]
# Live Polymarket REST + WS clients. Pulled in by `orderbook_probe` and any
# host that drives a real connection. Off by default so unit tests on the
# state-machine layer stay hermetic and cargo-test cheap.
default = ["polymarket-live"]
polymarket-live = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:reqwest",
    "dep:futures",
    "dep:serde_json",
    "dep:url",
    "dep:anyhow",
]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
metrics.workspace = true
dual_loop_common = { path = "../common" }

tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
sysinfo = "0.30"

[dev-dependencies]
proptest = "1.5"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
