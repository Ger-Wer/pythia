[workspace]
resolver = "2"
members = [
    "common",
    "sniper-ingest",
    "sniper-executor",
    "sniper-risk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ger-Wer/pythia"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
time = { version = "0.3", features = ["serde", "macros"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
bytes = "1.9"
once_cell = "1.20"
parking_lot = "0.12"
dashmap = "6.1"
futures = "0.3"
uuid = { version = "1.10", features = ["v7", "serde"] }

# Protobuf
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3.1"

# Bus clients
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp", "streams", "script"] }
async-nats = "0.38"

# Alloy (EVM)
alloy = { version = "0.8", features = ["full", "provider-ws", "provider-ipc", "pubsub", "rpc-types-trace"] }
alloy-sol-types = "0.8"
alloy-contract = "0.8"
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-node-bindings = "0.8"

# Hot-path data structures
smallvec = { version = "1.13", features = ["union", "serde"] }
ahash = "0.8"
arc-swap = "1.7"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Hex encoding
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
blake3 = "1.5"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"

# Prod hot-path profile: debug-assertions off, overflow-checks off, но с debug info для профилирования.
[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
