[workspace]
resolver = "2"
members = [
    "common",
    "sniper-ingest",
    "sniper-executor",
    "sniper-risk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ger-Wer/pythia"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
time = { version = "0.3", features = ["serde", "macros"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
bytes = "1.9"
once_cell = "1.20"
parking_lot = "0.12"

# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"

# Prod hot-path profile: debug-assertions off, overflow-checks off, но с debug info для профилирования.
[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
