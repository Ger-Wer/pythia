# Shared-host override for Dual-Loop dev stack.
#
# Use this on servers where other projects already publish local Redis/Postgres
# ports (for example, SproutSignal on `amper`). The Fast Loop services only need
# these backends on the internal compose network, so we can drop host bindings
# and avoid port collisions without changing service discovery.

services:
  redis:
    ports: []

  postgres:
    ports: []
