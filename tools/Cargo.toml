[workspace]
resolver = "2"
members = [
    "load_harness",
    "orderbook_probe",
]

# Standalone workspace for non-production tooling. Kept SEPARATE from the
# `services/` workspace on purpose:
#   * Production Dockerfile (`services/Dockerfile`) only copies `services/**`,
#     so tools never bleed into prod images.
#   * Tools can pull dev-only deps (e.g. clap, hdrhistogram) without polluting
#     the shrink-wrapped production hot-path crates.
# Both workspaces share `services/common` via path-dependency, which is fine —
# Cargo resolves the path crate independently in each workspace, sources are
# deduplicated on disk.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ger-Wer/pythia"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
async-nats = "0.38"
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp", "streams", "script"] }

clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

prost = "0.13"
bytes = "1.9"
futures = "0.3"
hdrhistogram = "7.5"
dashmap = "6.1"
hex = "0.4"

# Path-dep into the production workspace for protobuf types + topic
# constants. The other workspace is the source of truth for wire format.
dual_loop_common = { path = "../services/common" }
sniper-orderbook = { path = "../services/sniper-orderbook" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
