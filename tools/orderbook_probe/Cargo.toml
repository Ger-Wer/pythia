[package]
name = "orderbook_probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone binary that drives a live Polymarket order-book tracker and prints top-3 levels + spread for visual verification of REST/WS merge."

[[bin]]
name = "orderbook_probe"
path = "src/main.rs"

[dependencies]
sniper-orderbook = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
