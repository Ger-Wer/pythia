name: pythia

services:
  pythia-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: pythia:latest
    container_name: pythia-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      DB_PATH: ${DB_PATH:-/app/data/pythia.db}
      LOG_DIR: ${LOG_DIR:-/app/logs}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["scheduler"]
    networks:
      - pythia_internal
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f supercronic >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  pythia_internal:
    name: pythia_internal
    driver: bridge
