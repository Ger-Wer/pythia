name: pythia

services:
  pythia-v2:
    build:
      context: .
      dockerfile: Dockerfile
    image: pythia-v2:latest
    container_name: pythia-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      LOG_DIR: /app/logs
    volumes:
      # Stage 1 persistent state — snapshots and edge-analysis reports
      - ./python/backtest/snapshots:/app/python/backtest/snapshots
      - ./python/backtest/reports:/app/python/backtest/reports
      - ./python/backtest/data:/app/python/backtest/data
      - ./logs:/app/logs
    command: ["scheduler"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x supercronic >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
