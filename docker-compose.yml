name: pythia

services:
  pythia-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: pythia:latest
    container_name: pythia-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      DB_PATH: ${DB_PATH:-/app/data/pythia.db}
      LOG_DIR: ${LOG_DIR:-/app/logs}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["scheduler"]
    networks:
      - pythia_internal
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x supercronic >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  pythia-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    image: pythia:latest
    container_name: pythia-telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      DB_PATH: ${DB_PATH:-/app/data/pythia.db}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      TELEGRAM_OPERATOR_USER_ID: ${TELEGRAM_OPERATOR_USER_ID:-405690972}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["telegram"]
    networks:
      - pythia_internal
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -af '^/app/python/venv/bin/python python/telegram_operator.py$' >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  pythia_internal:
    name: pythia_internal
    driver: bridge
